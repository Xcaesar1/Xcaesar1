<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="300" viewBox="0 0 1056 300" role="img" aria-labelledby="title desc">
  <title id="title">Xcaesar1 GitHub contribution summary</title>
  <desc id="desc">Dark contribution summary card for Xcaesar1, showing 2026 contribution data from February to June and contact email.</desc>
  <defs>
    <linearGradient id="card-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="55%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#07111f" />
    </linearGradient>
    <linearGradient id="area-fill" x1="0" x2="0" y1="0" y2="1">
