      .label { fill: #8b949e; font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .value { fill: #9dd7ff; font: 21px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .small { fill: #9dd7ff; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .axis { fill: #8fb8d8; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .grid { stroke: #1f6feb; stroke-opacity: 0.22; stroke-width: 1; }
      .axis-line { stroke: #6e91ad; stroke-width: 1.4; }
      .icon { fill: #8b949e; }
    </style>
  </defs>

